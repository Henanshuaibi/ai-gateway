# CLIProxyAPI Configuration for Android / Termux
host: "0.0.0.0"
port: 8317
api-keys:
  - "REPLACE_WITH_YOUR_CLIENT_KEY"
remote-management:
  allow-remote: false
  secret-key: "REPLACE_WITH_YOUR_MANAGEMENT_SECRET"
  disable-control-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"
auth-dir: "~/.cliproxyapi/auth"
log-level: "info"
logging-to-file: true
logs-max-total-size-mb: 25
usage-statistics-enabled: true
routing:
  strategy: "round-robin"
# Prevent false 429 rate limit triggers from Google Antigravity sensor
antigravity:
  sensitive-words:
    - Nous
    - Research
# Model alias mappings for Hermes tool calling compatibility
oauth-model-alias:
  antigravity:
    - name: "gemini-3.8-flash-high"
      alias: "gemini-3.8-flash"
      fork: true
    - name: "gemini-3.8-flash-high"
      alias: "gemini-3.8-flash-customtools"
      fork: true
